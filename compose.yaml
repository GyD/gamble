name: gamble

services:
  app:
    build:
      context: .
      args:
        APP_ENV: production
    image: gamble-app:local
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME:-Gamble}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL must be set}
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gamble}
      DB_USERNAME: ${DB_USERNAME:-gamble}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?TWITCH_CLIENT_ID must be set}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?TWITCH_CLIENT_SECRET must be set}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:?TWITCH_REDIRECT_URI must be set}
      SESSION_NAME: ${SESSION_NAME:-gamble_session}
      SESSION_SECURE: ${SESSION_SECURE:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - app_logs:/app/var/log
      - php_sessions:/var/lib/php/sessions
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - tunnel

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-gamble}
      MARIADB_USER: ${DB_USERNAME:-gamble}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
      TZ: ${TZ:-UTC}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - tunnel

volumes:
  app_logs:
  database_data:
  php_sessions:

networks:
  backend:
    internal: true
  tunnel:
